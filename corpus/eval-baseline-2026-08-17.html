<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f9fe">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" crossorigin="anonymous">
<title>MedLens Vision — It sees, counts and explains your medicine</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f9fe;
    --white: #ffffff;
    --card: #ffffff;
    --ink: #0b1b3a;
    --muted: #51617f;
    --blue: #1e5eff;
    --blue-deep: #0a3bd6;
    --sky: #38bdf8;
    --line: #e2e9f8;
    --tint: #eef3fd;
    --blue-dim: rgba(30,94,255,.08);
    --danger: #d92d20;
    --danger-text: #b42318;
    --danger-dim: #fdf0ef;
    --danger-line: #f4c6c2;
    --amber: #b54708;
    --amber-text: #b54708;
    --amber-dim: #fdf6ec;
    --amber-line: #f2dcb8;
    --ok: #0e9f6e;
    --ok-text: #067a53;
    --ok-dim: #edf9f4;
    --ok-line: #bfe8d8;
    --sky-deep: #0284c7;
    --radius: 18px;
    --shadow: 0 10px 40px rgba(11, 27, 58, 0.08);
    --shadow-lg: 0 24px 70px rgba(11, 27, 58, 0.12);
    --head: "Space Grotesk", "Segoe UI", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* keyboard focus — branded, visible, only when navigating by key */
  :is(button, a, input, select, [tabindex]):focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }

  .grad {
    background: linear-gradient(92deg, var(--blue) 10%, var(--sky-deep) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ---------- ambient background ---------- */
  .bg-decor { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .bg-decor .orb { position: absolute; border-radius: 50%; filter: blur(80px); }
  .bg-decor .orb.a {
    width: 520px; height: 520px; top: -220px; left: 50%; transform: translateX(-50%);
    background: radial-gradient(circle, rgba(30,94,255,.14), transparent 65%);
  }
  .bg-decor .orb.b {
    width: 440px; height: 440px; bottom: -230px; right: -150px;
    background: radial-gradient(circle, rgba(56,189,248,.16), transparent 65%);
  }
  .bg-decor .orb.c {
    width: 340px; height: 340px; top: 40%; left: -180px;
    background: radial-gradient(circle, rgba(30,94,255,.08), transparent 65%);
  }
  .bg-decor::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(rgba(11,27,58,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(11,27,58,.028) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, #000 25%, transparent 75%);
  }

  .shell {
    max-width: 640px; margin: 0 auto;
    padding: 0 max(20px, env(safe-area-inset-left)) 96px max(20px, env(safe-area-inset-right));
  }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top)) 0 12px;
    background: rgba(247,249,254,.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  header::after {
    content: ""; position: absolute; left: -20px; right: -20px; bottom: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(30,94,255,.3), transparent);
  }
  .wordmark { display: flex; align-items: center; gap: 10px; user-select: none; cursor: pointer; background: none; border: 0; color: var(--ink); font-family: inherit; padding: 4px; border-radius: 10px; }
  .wordmark svg { display: block; filter: drop-shadow(0 4px 10px rgba(30,94,255,.3)); }
  .wordmark .name { font-family: var(--head); font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .wordmark .name b { color: var(--blue); font-weight: 700; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--white); border: 1px solid var(--line); color: var(--muted);
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
    display: grid; place-items: center; transition: color .15s, border-color .15s, box-shadow .15s, transform .12s;
    position: relative;
    box-shadow: 0 2px 10px rgba(11,27,58,.05);
  }
  .icon-btn:hover { color: var(--blue); border-color: rgba(30,94,255,.4); box-shadow: 0 4px 16px rgba(30,94,255,.15); transform: translateY(-1px); }
  .icon-btn.attention { color: var(--blue); border-color: rgba(30,94,255,.5); box-shadow: 0 0 0 4px var(--blue-dim); }
  .icon-btn .count {
    position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px;
    background: linear-gradient(135deg, var(--blue), var(--blue-deep)); color: #fff; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; display: grid; place-items: center; padding: 0 4px;
    box-shadow: 0 3px 10px rgba(30,94,255,.4);
  }

  /* ---------- view transitions ---------- */
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  section:not(.hidden) { animation: viewIn .38s cubic-bezier(.22,.8,.36,1); }

  /* ---------- hero / scan ---------- */
  .hero { padding: 36px 0 6px; text-align: center; }
  .hero h1 { text-wrap: balance; }
  .hero p.sub { text-wrap: pretty; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--head);
    font-size: 11px; font-weight: 600; letter-spacing: .22em; color: var(--blue);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .eyebrow::before, .eyebrow::after {
    content: ""; width: 26px; height: 1px; background: var(--blue); opacity: .6;
  }
  .hero h1 {
    font-family: var(--head);
    font-size: clamp(34px, 7.4vw, 48px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1;
    color: var(--ink);
  }
  .hero h1 span {
    background: linear-gradient(92deg, var(--blue) 10%, var(--sky-deep) 90%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero p.sub { color: var(--muted); margin-top: 14px; font-size: 15.5px; max-width: 46ch; margin-left: auto; margin-right: auto; }

  .scanzone {
    margin-top: 28px;
    position: relative;
    border: 1px solid var(--line);
    background: var(--white);
    border-radius: 26px;
    padding: 42px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s, transform .12s;
    box-shadow: var(--shadow);
    width: 100%;
    font-family: inherit;
    color: var(--ink);
    overflow: hidden;
  }
  .scanzone::after {
    content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 3px;
    border-radius: 0 0 6px 6px;
    background: linear-gradient(90deg, var(--blue), var(--sky));
    opacity: .9;
  }
  .scanzone::before {
    content: ""; position: absolute; inset: 10px; border-radius: 19px;
    border: 1.5px dashed rgba(30,94,255,.3); pointer-events: none;
    transition: border-color .2s;
  }
  .scanzone:hover, .scanzone.dragover {
    border-color: rgba(30,94,255,.45);
    box-shadow: var(--shadow-lg), 0 0 0 4px var(--blue-dim);
    transform: translateY(-2px);
  }
  .scanzone:hover::before, .scanzone.dragover::before { border-color: rgba(30,94,255,.55); }
  @keyframes ringPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(30,94,255,.25); }
    55% { box-shadow: 0 0 0 18px rgba(30,94,255,0); }
  }
  .scanzone .ring {
    width: 82px; height: 82px; margin: 0 auto 16px; border-radius: 24px;
    background: linear-gradient(135deg, var(--blue), var(--sky));
    display: grid; place-items: center; color: #fff;
    animation: ringPulse 2.6s ease-out infinite;
    box-shadow: 0 12px 30px rgba(30,94,255,.35);
  }
  .scanzone .zl1 { font-family: var(--head); font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .scanzone .zl2 { color: var(--muted); font-size: 13.5px; margin-top: 5px; }
  .btn-row { display: flex; gap: 10px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }
  .btn {
    border: 0; cursor: pointer; border-radius: 999px; padding: 13px 26px;
    font-size: 15px; font-weight: 600; font-family: var(--head);
    transition: filter .15s, transform .12s, box-shadow .15s, border-color .15s, color .15s;
  }
  .btn:active, .btn-primary:hover:active, .btn-ghost:hover:active { transform: translateY(1px); }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue), var(--blue-deep));
    color: #fff;
    box-shadow: 0 10px 26px rgba(30,94,255,.35);
  }
  .btn-primary:hover:not(:active) { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 14px 34px rgba(30,94,255,.42); }
  .btn-primary[disabled] { filter: saturate(.2) opacity(.6); cursor: default; transform: none; box-shadow: none; }
  .btn-ghost { background: var(--white); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(11,27,58,.05); }
  .btn-ghost:hover:not(:active) { border-color: rgba(30,94,255,.45); color: var(--blue); transform: translateY(-1px); }
  .btn-ghost[disabled] { color: var(--ok-text); border-color: var(--ok-line); background: var(--ok-dim); cursor: default; transform: none; }
  .keyhint { margin-top: 14px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .linklike { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; font: inherit; font-weight: 600; }

  /* ---------- steps strip ---------- */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 36px; }
  .step {
    background: var(--white);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 16px; text-align: left; position: relative; overflow: hidden;
    transition: border-color .2s, transform .15s, box-shadow .2s;
    box-shadow: 0 4px 18px rgba(11,27,58,.05);
  }
  .step::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--blue), var(--sky));
    opacity: 0; transition: opacity .2s;
  }
  .step:hover { border-color: rgba(30,94,255,.35); transform: translateY(-3px); box-shadow: var(--shadow); }
  .step:hover::before { opacity: 1; }
  .step .num { font-family: var(--head); font-size: 11px; letter-spacing: .18em; color: var(--blue); font-weight: 700; }
  .step .t { font-family: var(--head); font-size: 14px; font-weight: 600; margin-top: 6px; }
  .step .d { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* ---------- in-app camera ---------- */
  .camera { padding-top: 8px; }
  .cam-wrap { position: relative; border-radius: 22px; overflow: hidden; background: var(--ink); box-shadow: var(--shadow-lg); }
  .cam-wrap video { width: 100%; aspect-ratio: 3/4; max-height: min(64vh, 560px); object-fit: cover; display: block; margin: 0 auto; }
  .cam-frame {
    position: absolute; inset: 7%; border-radius: 16px; pointer-events: none;
    border: 2px dashed rgba(255,255,255,.6);
    box-shadow: 0 0 0 200vmax rgba(11,27,58,.25);
  }
  .cam-controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 16px; }
  .cam-controls .back { justify-self: start; padding: 12px 16px 12px 0; }
  .shutter {
    width: 68px; height: 68px; border-radius: 50%; border: 4px solid var(--white); cursor: pointer;
    background: linear-gradient(135deg, var(--blue), var(--blue-deep));
    box-shadow: 0 10px 30px rgba(30,94,255,.4), 0 0 0 1px rgba(11,27,58,.14), 0 0 0 6px rgba(30,94,255,.15);
    justify-self: center; transition: transform .1s;
  }
  .shutter:active { transform: scale(.92); }
  .cam-hint { justify-self: end; font-size: 12px; color: var(--muted); max-width: 110px; text-align: right; }

  /* ---------- analyzing ---------- */
  .analyzing { text-align: center; padding: 60px 0 30px; }
  .preview-wrap { position: relative; width: min(300px, 80%); margin: 0 auto; }
  .preview-wrap img {
    width: 100%; border-radius: 20px; border: 1px solid var(--line);
    display: block;
    box-shadow: var(--shadow-lg);
  }
  .scanline {
    position: absolute; left: 6%; right: 6%; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--blue), var(--sky), transparent);
    animation: sweep 1.6s ease-in-out infinite; top: 12%;
    box-shadow: 0 0 24px rgba(30,94,255,.55);
  }
  @keyframes sweep { 0%,100% { top: 10%; } 50% { top: 88%; } }
  .analyzing .stage { margin-top: 22px; font-size: 15px; color: var(--muted); min-height: 24px; }
  .analyzing .stage::after {
    content: "...";
    display: inline-block; width: 0; overflow: hidden; vertical-align: bottom;
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots { to { width: 1.3em; } }
  .analyzing .cancel-row { margin-top: 18px; }

  /* ---------- result ---------- */
  .result { padding-top: 8px; }
  .result-top { display: flex; align-items: center; gap: 10px; margin: 6px 0 14px; }
  .back { font-size: 13.5px; color: var(--muted); cursor: pointer; background: none; border: none; font-family: inherit; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; padding: 6px 0; transition: color .15s; }
  .back:hover { color: var(--blue); }

  .med-card {
    position: relative;
    background: var(--white);
    border: 1px solid var(--line); border-radius: 22px; padding: 24px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .med-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--blue), var(--sky));
  }
  .med-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .med-name { font-family: var(--head); font-size: 27px; font-weight: 700; letter-spacing: -.02em; line-height: 1.12; }
  .med-generic { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .badge {
    font-family: var(--head);
    font-size: 11px; font-weight: 700; letter-spacing: .07em; white-space: nowrap;
    padding: 6px 12px; border-radius: 999px; flex-shrink: 0;
  }
  .badge.ok { background: var(--ok-dim); color: var(--ok-text); border: 1px solid var(--ok-line); }
  .badge.ai { background: var(--blue-dim); color: var(--blue-deep); border: 1px solid rgba(30,94,255,.3); }
  .badge.rx { background: var(--amber-dim); color: var(--amber-text); border: 1px solid var(--amber-line); }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 13px; }
  .chip {
    font-size: 12px; font-weight: 500; color: var(--muted); background: var(--tint);
    border: 1px solid var(--line); padding: 5px 12px; border-radius: 999px;
  }

  .conf-banner {
    margin-top: 14px; border-radius: 14px; padding: 13px 15px;
    border: 1px solid var(--amber-line); background: var(--amber-dim);
    font-size: 13.5px;
  }
  .conf-banner b { color: var(--amber-text); }

  .section {
    margin-top: 14px; background: var(--white);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 16px;
    box-shadow: 0 4px 18px rgba(11,27,58,.04);
  }
  .section h3 {
    font-family: var(--head);
    font-size: 11.5px; letter-spacing: .16em; font-weight: 700; color: var(--blue);
    text-transform: uppercase; display: flex; align-items: center; gap: 10px;
  }
  .section h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(30,94,255,.3), transparent); }
  .section .body { margin-top: 10px; font-size: 15px; color: var(--ink); }
  .section ul { margin: 10px 0 0 0; list-style: none; }
  .section li { padding: 8px 0 8px 22px; position: relative; font-size: 14.5px; border-top: 1px solid var(--line); }
  .section li:first-child { border-top: 0; padding-top: 2px; }
  .section li::before {
    content: ""; position: absolute; left: 2px; top: 16px; width: 7px; height: 7px;
    border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--sky));
  }
  .section li:first-child::before { top: 10px; }
  .section.warn { border-color: var(--danger-line); background: linear-gradient(180deg, #fffbfb, var(--white)); }
  .section.warn h3 { color: var(--danger-text); }
  .section.warn h3::after { background: linear-gradient(90deg, rgba(217,45,32,.3), transparent); }
  .section.warn li::before { background: var(--danger); }

  /* interaction check states */
  .ix-clear {
    display: flex; align-items: center; gap: 10px; margin-top: 12px;
    color: var(--ok-text); font-size: 14.5px; font-weight: 600;
  }
  .ix-clear .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px var(--ok-dim); }
  .ix-note { color: var(--muted); font-size: 12.5px; margin-top: 9px; }
  .ix-item {
    margin-top: 11px; border-radius: 14px; padding: 13px 15px;
    border: 1px solid var(--danger-line); background: var(--danger-dim);
  }
  .ix-item.caution { border-color: var(--amber-line); background: var(--amber-dim); }
  .ix-item .with { font-family: var(--head); font-weight: 700; font-size: 14px; }
  .ix-item.avoid .with { color: var(--danger-text); }
  .ix-item.caution .with { color: var(--amber-text); }
  .ix-item .note { font-size: 13.5px; margin-top: 5px; color: var(--ink); }
  .ix-sev {
    font-family: var(--head);
    font-size: 10.5px; font-weight: 700; letter-spacing: .09em; margin-left: 8px;
    padding: 2px 9px; border-radius: 999px; vertical-align: 2px;
  }
  .ix-item.avoid .ix-sev { background: rgba(217,45,32,.12); color: var(--danger-text); }
  .ix-item.caution .ix-sev { background: rgba(181,71,8,.12); color: var(--amber-text); }

  .demo-callout {
    margin-top: 12px; border-radius: 14px; padding: 14px 15px;
    border: 1px solid rgba(30,94,255,.3); background: var(--blue-dim);
    font-size: 13.5px;
  }
  .demo-callout b { color: var(--blue-deep); }
  .demo-callout .btn { margin-top: 10px; padding: 10px 18px; font-size: 13.5px; }

  .sources { margin-top: 14px; }
  .sources .chip a { color: inherit; text-decoration: none; }
  .sources .chip.fda { color: var(--ok-text); border-color: var(--ok-line); background: var(--ok-dim); }
  .chip.vis { color: var(--blue-deep); border-color: #c9d9fb; background: var(--blue-dim); }
  .chip.vis.ok { color: var(--ok-text); border-color: var(--ok-line); background: var(--ok-dim); }
  .chip.vis.used { color: var(--danger-text); border-color: var(--danger-line); background: var(--danger-dim); }
  .vis-img { width: 100%; max-height: 340px; object-fit: contain; border-radius: 12px; border: 1px solid var(--line); background: #0b1b3a; margin-bottom: 10px; }

  .result-actions { display: flex; gap: 10px; margin-top: 18px; }
  .result-actions .btn { flex: 1; }

  .disclaimer {
    margin-top: 16px; font-size: 12.5px; color: var(--muted);
    background: var(--tint); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 15px; line-height: 1.55;
  }
  .disclaimer b { color: var(--ink); }

  /* ---------- my meds ---------- */
  .drawer-title { font-family: var(--head); font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 8px 0 4px; }
  .drawer-sub { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .drawer-note { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .medlist { display: flex; flex-direction: column; gap: 10px; }
  .medlist .item {
    background: var(--white);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; transition: border-color .2s, box-shadow .2s;
    box-shadow: 0 4px 18px rgba(11,27,58,.04);
  }
  .medlist .item:hover { border-color: rgba(30,94,255,.3); box-shadow: var(--shadow); }
  .medlist .row1 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .medlist .n { font-family: var(--head); font-weight: 600; font-size: 15px; cursor: pointer; transition: color .15s; background: none; border: 0; color: var(--ink); text-align: left; padding: 0; }
  .medlist .n:hover { color: var(--blue); }
  .medlist .g { color: var(--muted); font-size: 12.5px; }
  .medlist .rm {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; font-family: inherit;
    padding: 10px 12px; margin: -6px -8px -6px 0; min-height: 44px; border-radius: 10px; transition: color .15s, background .15s;
  }
  .medlist .rm:hover { color: var(--danger-text); background: var(--danger-dim); }
  .medlist .row2 {
    display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--line); flex-wrap: wrap;
  }
